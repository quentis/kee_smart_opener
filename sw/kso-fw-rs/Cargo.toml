[package]
name = "kso-fw"
version = "0.1.0"
edition = "2024"

[dependencies]
rp235x-hal = { version = "0.4.0", features = ["rt", "critical-section-impl"] }
embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"
cortex-m = "0.7.8"
cortex-m-rt = "0.7.6"
usb-device = "0.3.2"
usbd-serial = "0.2.2"
heapless = "0.9.3"

[profile.dev]
opt-level = 0
debug = 2

# Override optimization for ALL dependencies (including the HAL and core)
[profile.dev.package."*"]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true