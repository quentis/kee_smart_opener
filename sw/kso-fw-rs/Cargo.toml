[package]
name = "kso-fw"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7"}
cortex-m-rt = "0.7.5"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "defmt", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "time-driver", "critical-section-impl", "binary-info", "rp235xa"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
cc1101-embassy = { version = "0.1.0", features = ["defmt"] }
static_cell = "2.1.1"
embedded-hal-async = "1.0.0"
fugit = "0.6.0"

[patch.crates-io]
# Local copy: OOK keys the PA via PATABLE[0] (off) and PATABLE[1] (power); see vendor/cc1101-embassy/src/driver.rs
cc1101-embassy = { path = "vendor/cc1101-embassy" }

[[bin]]
name = "kso-fw"
path = "src/main.rs"
test = false

[profile.dev]
opt-level = 0
debug = 2

# Override optimization for ALL dependencies (including the HAL and core)
[profile.dev.package."*"]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
